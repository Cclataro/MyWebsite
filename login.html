<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0c1445 0%, #1a237e 50%, #283593 100%);
            overflow: hidden;
            position: relative;
        }
        .moving-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .moving-bg img {
            position: absolute;
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 12px;
            opacity: 0.12;
            animation: floatPic 20s infinite ease-in-out;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .moving-bg img:nth-child(1) {
            top: 8%;
            left: 5%;
            animation-delay: 0s;
        }

        .moving-bg img:nth-child(2) {
            top: 15%;
            right: 6%;
            animation-delay: 4s;
        }

        .moving-bg img:nth-child(3) {
            bottom: 12%;
            left: 8%;
            animation-delay: 8s;
        }

        .moving-bg img:nth-child(4) {
            bottom: 8%;
            right: 5%;
            animation-delay: 12s;
        }

        .moving-bg img:nth-child(5) {
            top: 45%;
            left: 3%;
            animation-delay: 16s;
        }

        @keyframes floatPic {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
            }
            25% {
                transform: translateY(-60px) translateX(20px) rotate(5deg);
            }
            50% {
                transform: translateY(-30px) translateX(-15px) rotate(-3deg);
            }
            75% {
                transform: translateY(-80px) translateX(10px) rotate(3deg);
            }
            100% {
                transform: translateY(0) translateX(0) rotate(0deg);
            }
        }

        .form-container {
            background: rgba(255, 255, 255, 0.08);
            padding: 45px 35px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.35), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 420px;
            z-index: 1;
            animation: popIn 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            backdrop-filter: blur(12px);
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.85);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        h2 {
            text-align: center;
            color: #fff;
            font-size: 34px;
            margin-bottom: 35px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        h2 span {
            background: linear-gradient(90deg, #4fc3f7, #1976d2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        label {
            display: block;
            font-size: 14px;
            color: #d0d0d0;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 15px 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            font-size: 15px;
            color: #fff;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        input:focus {
            outline: none;
            border-color: #4fc3f7;
            background: rgba(79, 195, 247, 0.08);
            box-shadow: 0 0 0 4px rgba(79, 195, 247, 0.15);
        }

        .show-password {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
            cursor: pointer;
        }

        .show-password input {
            width: 18px;
            height: 18px;
            margin: 0;
            accent-color: #4fc3f7;
        }

        .show-password label {
            margin: 0;
            color: #b0b0b0;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #4fc3f7, #1976d2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(79, 195, 247, 0.35);
        }

        button:active {
            transform: translateY(0);
        }

        #errorMessage {
            color: #ff6b6b;
            text-align: center;
            margin-top: 14px;
            font-size: 14px;
            min-height: 22px;
        }

        .hint-text {
            margin-top: 25px;
            padding: 14px;
            background: rgba(79, 195, 247, 0.08);
            border: 1px solid rgba(79, 195, 247, 0.15);
            border-radius: 10px;
            text-align: center;
            font-size: 13px;
            color: #b3e5fc;
            line-height: 1.6;
        }

        .hint-text strong {
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="moving-bg">
        <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa6e?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=80" alt="Laptop & Code">
        <img src="https://images.unsplash.com/photo-1496369333049-43153a4012d7?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=80" alt="Computer Setup">
        <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=80" alt="Circuit Board">
        <img src="https://images.unsplash.com/photo-1504639725590-34d0984388bd?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=80" alt="Tech Workspace">
        <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=80" alt="Computer Parts">
    </div>

    <div class="form-container">
        <h2><span>Login</span></h2>
        <form id="authForm" onsubmit="return false;">
            <label for="username">👤 Username</label>
            <input type="text" id="username" placeholder="Enter your username" required>
            
            <label for="password">🔒 Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
            
            <div class="show-password">
                <input type="checkbox" id="showPassword" onclick="togglePasswordVisibility()">
                <label for="showPassword">Show Password</label>
            </div>
            
            <button type="button" onclick="handleSubmit()">Login</button>
            <p id="errorMessage"></p>
            
            <p class="hint-text">💡 Tip: Username: <strong>clataro</strong><br>Password: <strong>12345678</strong></p>
        </form>
    </div>

    <script>
        const VALID_USERNAME = "clataro";
        const VALID_PASSWORD = "12345678";

        function handleSubmit() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            if (username === VALID_USERNAME && password === VALID_PASSWORD) {
                alert('✅ Welcome! Successfully logged in.');
                window.location.href = 'index.html';
            } else {
                errorMessage.textContent = '❌ Invalid username or password';
            }
        }

        function togglePasswordVisibility() {
            const passwordField = document.getElementById('password');
            const checkbox = document.getElementById('showPassword');
            passwordField.type = checkbox.checked ? 'text' : 'password';
        }
    </script>
    
</body>
</html>
